<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Sakti</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen">
<div class="bg-white text-black p-6 rounded-3xl w-72">
<h1 class="text-center font-bold mb-4">KALKULATOR GATOTKACA</h1>
<input id="layar" class="w-full bg-gray-100 p-3 rounded-xl text-right text-2xl mb-4" readonly>
<div class="grid grid-cols-4 gap-2">
<button onclick="tekan('7')" class="p-4 bg-gray-200 rounded-xl">7</button>
<button onclick="tekan('8')" class="p-4 bg-gray-200 rounded-xl">8</button>
<button onclick="tekan('9')" class="p-4 bg-gray-200 rounded-xl">9</button>
<button onclick="tekan('/')" class="p-4 bg-orange-400 text-white rounded-xl">/</button>
<button onclick="tekan('4')" class="p-4 bg-gray-200 rounded-xl">4</button>
<button onclick="tekan('5')" class="p-4 bg-gray-200 rounded-xl">5</button>
<button onclick="tekan('6')" class="p-4 bg-gray-200 rounded-xl">6</button>
<button onclick="tekan('*')" class="p-4 bg-orange-400 text-white rounded-xl">x</button>
<button onclick="tekan('1')" class="p-4 bg-gray-200 rounded-xl">1</button>
<button onclick="tekan('2')" class="p-4 bg-gray-200 rounded-xl">2</button>
<button onclick="tekan('3')" class="p-4 bg-gray-200 rounded-xl">3</button>
<button onclick="tekan('-')" class="p-4 bg-orange-400 text-white rounded-xl">-</button>
<button onclick="hapus()" class="p-4 bg-red-400 text-white rounded-xl">C</button>
<button onclick="tekan('0')" class="p-4 bg-gray-200 rounded-xl">0</button>
<button onclick="hitung()" class="p-4 bg-black text-white rounded-xl">=</button>
<button onclick="tekan('+')" class="p-4 bg-orange-400 text-white rounded-xl">+</button>
</div>
<a href="index.html" class="block text-center mt-4 text-sm">Kembali</a>
</div>
<script>
let layar = document.getElementById('layar');
function tekan(a){layar.value+=a}
function hapus(){layar.value=''}
function hitung(){try{layar.value=eval(layar.value)}catch{layar.value='Error'}}
</script>
</body>
</html>
